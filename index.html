<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>葛生駅 リアルタイム発車案内ディスプレイ</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Noto+Sans+JP:wght@700;900&display=swap');

    :root {
      --bg-board: #000000;
      --border-outer: #222222;
      --text-white: #ffffff;
      --text-yellow: #ffcc00;
      --text-orange: #ff9900;
      --text-gray: #aaaaaa;
      --badge-ltd: #d90429;
      --badge-local: #ffffff;
      --delay-red: #ff3333;
      --ok-green: #00ff66;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #0d0d0d;
      color: var(--text-white);
      font-family: 'Noto Sans JP', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .board-container {
      background-color: var(--bg-board);
      width: 100%;
      max-width: 1100px;
      border: 12px solid var(--border-outer);
      border-radius: 8px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.9);
      padding: 20px;
      overflow: hidden;
    }

    .board-container.is-delayed {
      border-color: var(--delay-red);
      animation: pulse-border 2s infinite;
    }

    @keyframes pulse-border {
      0% { border-color: #ff3333; }
      50% { border-color: #660000; }
      100% { border-color: #ff3333; }
    }

    /* 上部ホーム案内 */
    .top-banner {
      display: flex;
      align-items: center;
      border-bottom: 2px solid #333;
      height: 50px;
      margin-bottom: 15px;
    }

    .platform-num {
      background: linear-gradient(135deg, #111, #333);
      color: #fff;
      font-size: 2rem;
      font-weight: 900;
      width: 55px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
      border-right: 6px solid #f60;
      margin-right: 15px;
      font-family: 'Chakra Petch', sans-serif;
      flex-shrink: 0;
    }

    .banner-text {
      font-size: 1.25rem;
      color: #ddd;
      font-weight: bold;
      line-height: 50px;
      height: 50px;
      display: flex;
      align-items: center;
    }

    /* テーブルヘッダー */
    .board-header {
      display: grid;
      grid-template-columns: 220px 180px 1fr 140px;
      color: var(--text-gray);
      font-size: 0.95rem;
      border-bottom: 1px solid #444;
      height: 30px;
      line-height: 30px;
      text-align: center;
    }

    /* 発車行 */
    .board-row {
      display: grid;
      grid-template-columns: 220px 180px 1fr 140px;
      align-items: center;
      border-bottom: 1px solid #222;
      text-align: center;
      height: 85px;
    }

    .dept-time {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 3.5rem;
      font-weight: 700;
      color: var(--text-white);
      line-height: 85px;
    }

    .badge-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
    }

    .train-badge {
      width: 140px;
      height: 42px;
      line-height: 42px;
      font-size: 1.3rem;
      font-weight: 900;
      border-radius: 4px;
      text-align: center;
    }

    .badge-ltd { background-color: var(--badge-ltd); color: #fff; }
    .badge-local { background-color: var(--badge-local); color: #000; }
    .badge-end { background-color: #333333; color: #aaaaaa; }

    .destination {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--text-white);
      text-align: left;
      padding-left: 30px;
      line-height: 85px;
      white-space: nowrap;
    }

    .cars-info {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--text-white);
      line-height: 85px;
    }

    .cars-unit { font-size: 1.1rem; font-weight: normal; margin-left: 4px; }

    /* 運行状況テロップバー */
    .notice-bar {
      background-color: #111;
      color: var(--ok-green);
      border: 1px solid #333;
      height: 48px;
      margin: 15px 0;
      font-size: 1.2rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .notice-bar.has-delay {
      background-color: #4a0000;
      color: #ffffff;
      border-color: var(--delay-red);
      font-size: 1.35rem;
    }

    /* 下段マルチ接続カード（高視認性改修） */
    .info-section {
      background: #060b18;
      border: 2px solid #1c2d4a;
      border-radius: 8px;
      padding: 12px 18px;
      height: 185px;
    }

    .info-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 32px;
      margin-bottom: 8px;
    }

    .info-title-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .route-badge {
      background: linear-gradient(135deg, #0088ff, #0055cc);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 4px;
      font-family: 'Chakra Petch', sans-serif;
      letter-spacing: 0.5px;
    }

    .info-title-text {
      color: #38bdf8;
      font-size: 1.25rem;
      font-weight: 900;
    }

    .info-countdown-box {
      background: #000;
      border: 1px solid #2a3a57;
      padding: 4px 14px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 1.25rem;
      color: var(--ok-green);
      font-weight: bold;
    }

    /* 3ブロックフロー（メリハリデザイン） */
    .info-connection-flow {
      display: grid;
      grid-template-columns: 1fr 28px 1.5fr 28px 1fr;
      align-items: center;
      gap: 6px;
      height: 115px;
    }

    .step-card {
      background: #111625;
      border: 1px solid #233555;
      border-radius: 6px;
      padding: 8px 6px;
      height: 115px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }

    .step-card.highlight {
      background: #0f1c33;
      border-color: #38bdf8;
    }

    .step-station-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
    }

    .step-station-name {
      font-size: 1.05rem;
      color: #e2e8f0;
      font-weight: 900;
    }

    .platform-badge {
      background: #ffcc00;
      color: #000;
      font-size: 0.75rem;
      font-weight: 900;
      padding: 1px 6px;
      border-radius: 3px;
    }

    .step-time-main {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 2.1rem;
      font-weight: 700;
      color: var(--text-yellow);
      line-height: 1.1;
    }

    .step-time-transfer {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-orange);
      line-height: 1.1;
      white-space: nowrap;
    }

    .step-sub-label {
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .arrow {
      color: #38bdf8;
      font-size: 1.4rem;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>

    <div class="top-banner">

    <!-- 先発 (1本目) -->
    <div class="board-row">
      <div class="dept-time" id="m1-time">--:--</div>
      <div class="badge-container"><span class="train-badge badge-local" id="m1-badge">普通</span></div>
      <div class="destination" id="m1-dest">--</div>
      <div class="cars-info" id="m1-cars">--<span class="cars-unit" id="m1-unit">両</span></div>
    </div>

    <!-- 運行状況テロップ -->
    <div class="notice-bar" id="notice-text">
      【運行状況】東武佐野線・JR両毛線：平常運転
    </div>

    <!-- 次発 (2本目) -->
    <div class="board-row">
      <div class="dept-time" id="m2-time">--:--</div>
      <div class="badge-container"><span class="train-badge badge-local" id="m2-badge">普通</span></div>
      <div class="destination" id="m2-dest">--</div>
      <div class="cars-info" id="m2-cars">--<span class="cars-unit" id="m2-unit">両</span></div>
    </div>

    <!-- 次々発 (3本目) -->
    <div class="board-row" style="border: none;">
      <div class="dept-time" id="m3-time">--:--</div>
      <div class="badge-container"><span class="train-badge badge-local" id="m3-badge">普通</span></div>
      <div class="destination" id="m3-dest">--</div>
      <div class="cars-info" id="m3-cars">--<span class="cars-unit" id="m3-unit">両</span></div>
    </div>

    <!-- 3. 高視認性 マルチ接続案内カード -->
    <div class="info-section">
      <div class="info-header">
        <div class="info-title-box">
          <span class="route-badge" id="card-badge">TOKYO ROUTE</span>
          <span class="info-title-text" id="info-card-title">北千住方面 接続案内</span>
        </div>
        <div class="info-countdown-box" id="info-countdown">
          あと --:--
        </div>
      </div>

      <div class="info-connection-flow">
        <!-- 葛生発 -->
        <div class="step-card">
          <div class="step-station-row">
            <span class="step-station-name" id="st-origin">葛生</span>
            <span class="platform-badge">1番線</span>
          </div>
          <div class="step-time-main" id="origin-dep-time">--:--</div>
          <div class="step-sub-label" id="lbl-origin-line">東武佐野線</div>
        </div>

        <div class="arrow">➔</div>

        <!-- 乗り換え駅（中央強調） -->
        <div class="step-card highlight">
          <div class="step-station-row">
            <span class="step-station-name" id="st-transfer">館林駅 乗り換え</span>
            <span class="platform-badge" id="pf-transfer">上り</span>
          </div>
          <div class="step-time-transfer" id="transfer-time">--:-- / --:--</div>
          <div class="step-sub-label" id="lbl-transfer-info" style="color: #ffcc00;">--</div>
        </div>

        <div class="arrow">➔</div>

        <!-- 目的地到着 -->
        <div class="step-card">
          <div class="step-station-row">
            <span class="step-station-name" id="st-dest">北千住駅 到着</span>

        </div>
      </div>
    </div>

  </div>

      { kuzuDep: "20:10", tateArr: "20:43", tateDep: "20:49", senjuArr: "21:55", noteJa: "普通（浅草行）", noteEn: "Local for Asakusa" },
      { kuzuDep: "20:46", tateArr: "21:19", tateDep: "21:25", senjuArr: "22:31", noteJa: "普通（久喜行）", noteEn: "Local for Kuki" },
      { kuzuDep: "21:19", tateArr: "21:52", tateDep: "21:58", senjuArr: "23:05", noteJa: "普通（久喜行）", noteEn: "Local for Kuki" },

      { kuzuDep: "22:13", tateArr: "22:46", tateDep: "22:52", senjuArr: "00:08", noteJa: "普通（北千住行）", noteEn: "Local for Kita-senju" },
      { kuzuDep: "23:02", tateArr: "23:35", tateDep: "---",   senjuArr: "---",   noteJa: "館林止まり", noteEn: "Final train" }
    ];

    // ② 佐野駅乗り換え JR両毛線（小山方面：下り/2番線）接続データ
    const sanoOyamaRoutes = [
      { kuzuDep: "05:45", sanoArr: "05:53", sanoDep: "06:01", oyamaArr: "06:33", lineJa: "JR両毛線 (小山行)", lineEn: "JR Ryomo Line" },
      { kuzuDep: "06:13", sanoArr: "06:21", sanoDep: "06:37", oyamaArr: "07:11", lineJa: "JR両毛線 (小山行)", lineEn: "JR Ryomo Line" },
      { kuzuDep: "06:36", sanoArr: "06:44", sanoDep: "07:07", oyamaArr: "07:38", lineJa: "JR両毛線 (小山行)", lineEn: "JR Ryomo Line" },
      { kuzuDep: "07:08", sanoArr: "07:16", sanoDep: "07:39", oyamaArr: "08:14", lineJa: "JR両毛線 (小山行)", lineEn: "JR Ryomo Line" },
      { kuzuDep: "07:36", sanoArr: "07:44", sanoDep: "08:13", oyamaArr: "08:48", lineJa: "JR両毛線 (小山行)", lineEn: "JR Ryomo Line" },
      { kuzuDep: "08:13", sanoArr: "08:21", sanoDep: "08:52", oyamaArr: "09:25", lineJa: "JR両毛線 (小山行)", lineEn: "JR Ryomo Line" },
      { kuzuDep: "16:09", sanoArr: "16:17", sanoDep: "16:32", oyamaArr: "17:04", lineJa: "JR両毛線 (小山行)", lineEn: "JR Ryomo Line" },
      { kuzuDep: "17:11", sanoArr: "17:19", sanoDep: "17:31", oyamaArr: "18:04", lineJa: "JR両毛線 (小山行)", lineEn: "JR Ryomo Line" },
      { kuzuDep: "18:06", sanoArr: "18:14", sanoDep: "18:22", oyamaArr: "18:55", lineJa: "JR両毛線 (小山行)", lineEn: "JR Ryomo Line" },
      { kuzuDep: "18:39", sanoArr: "18:47", sanoDep: "18:58", oyamaArr: "19:30", lineJa: "JR両毛線 (小山行)", lineEn: "JR Ryomo Line" },
      { kuzuDep: "19:12", sanoArr: "19:20", sanoDep: "19:28", oyamaArr: "20:00", lineJa: "JR両毛線 (小山行)", lineEn: "JR Ryomo Line" },
      { kuzuDep: "19:39", sanoArr: "19:47", sanoDep: "20:10", oyamaArr: "20:42", lineJa: "JR両毛線 (小山行)", lineEn: "JR Ryomo Line" },
      { kuzuDep: "20:10", sanoArr: "20:18", sanoDep: "20:38", oyamaArr: "21:10", lineJa: "JR両毛線 (小山行)", lineEn: "JR Ryomo Line" }
    ];

    // ③ 佐野駅乗り換え JR両毛線（高崎方面：上り/1番線）接続データ
    const sanoTakasakiRoutes = [
      { kuzuDep: "06:13", sanoArr: "06:21", sanoDep: "06:33", takasakiArr: "08:01", lineJa: "JR両毛線 (高崎行)", lineEn: "JR Ryomo Line" },
      { kuzuDep: "07:08", sanoArr: "07:16", sanoDep: "07:36", takasakiArr: "09:07", lineJa: "JR両毛線 (高崎行)", lineEn: "JR Ryomo Line" },
      { kuzuDep: "08:13", sanoArr: "08:21", sanoDep: "08:48", takasakiArr: "10:14", lineJa: "JR両毛線 (高崎行)", lineEn: "JR Ryomo Line" },
      { kuzuDep: "16:09", sanoArr: "16:17", sanoDep: "16:34", takasakiArr: "18:03", lineJa: "JR両毛線 (高崎行)", lineEn: "JR Ryomo Line" },
      { kuzuDep: "17:11", sanoArr: "17:19", sanoDep: "17:28", takasakiArr: "18:54", lineJa: "JR両毛線 (高崎行)", lineEn: "JR Ryomo Line" },
      { kuzuDep: "18:06", sanoArr: "18:14", sanoDep: "18:24", takasakiArr: "19:54", lineJa: "JR両毛線 (高崎行)", lineEn: "JR Ryomo Line" },
      { kuzuDep: "18:39", sanoArr: "18:47", sanoDep: "18:55", takasakiArr: "20:25", lineJa: "JR両毛線 (高崎行)", lineEn: "JR Ryomo Line" },
      { kuzuDep: "19:12", sanoArr: "19:20", sanoDep: "19:27", takasakiArr: "20:54", lineJa: "JR両毛線 (高崎行)", lineEn: "JR Ryomo Line" },
      { kuzuDep: "20:10", sanoArr: "20:18", sanoDep: "20:35", takasakiArr: "22:00", lineJa: "JR両毛線 (高崎行)", lineEn: "JR Ryomo Line" }
    ];

    // 4秒ごとにモードをローテーション
    setInterval(() => {
      displayMode = (displayMode + 1) % 4;
      updateHeaderTexts();
      updateMonitor();
    }, 4000);

    function updateHeaderTexts() {
      const isEnglish = (displayMode === 1);
      document.getElementById("hdr-dept").textContent = isEnglish ? "Departure time" : "発車時刻";
      document.getElementById("hdr-train").textContent = isEnglish ? "Train" : "種別";
      document.getElementById("hdr-to").textContent = isEnglish ? "To" : "行先";
      document.getElementById("hdr-cars").textContent = isEnglish ? "Cars" : "両数";
      
      document.getElementById("m1-unit").textContent = isEnglish ? "Cars" : "両";
      document.getElementById("m2-unit").textContent = isEnglish ? "Cars" : "両";
      document.getElementById("m3-unit").textContent = isEnglish ? "Cars" : "両";

      document.getElementById("top-banner-text").textContent = isEnglish 
        ? "for Sano, Tatebayashi, Asakusa"
        : "佐野・館林・浅草 方面";
    }

    function updateMonitor() {
      const now = new Date();
      const currentMin = now.getHours() * 60 + now.getMinutes();
      const currentSec = now.getSeconds();

      // 1. 上部 発車標の更新
      const upcomingMy = kuzuFullRoutes.filter(r => {
        const [h, m] = r.time.split(":").map(Number);
        return (h * 60 + m) > currentMin || ((h * 60 + m) === currentMin && currentSec === 0);
      });

      const isEnglishMode = (displayMode === 1);

      if (upcomingMy.length === 0) {
        document.getElementById("notice-text").textContent = isEnglishMode 
          ? "【Notice】 End of today's train service."
          : "【案内】本日の電車は終了いたしました。";
          
        setRowDataFinished("m1", isEnglishMode);
        setRowDataFinished("m2", isEnglishMode);
        setRowDataFinished("m3", isEnglishMode);
      } else {
        document.getElementById("notice-text").textContent = isEnglishMode
          ? "【Status】 Tobu Sano Line / JR Ryomo Line: Normal Operation"
          : "【運行状況】東武佐野線・JR両毛線：平常運転";

        setRowData("m1", upcomingMy[0], isEnglishMode);
        setRowData("m2", upcomingMy[1], isEnglishMode);
        setRowData("m3", upcomingMy[2], isEnglishMode);
      }

      // 2. 下段 マルチ接続カードの更新
      const countdownEl = document.getElementById("info-countdown");

      if (displayMode === 0 || displayMode === 1) {
        // --- 北千住方面 ---
        const isEn = (displayMode === 1);
        document.getElementById("card-badge").textContent = "TOKYO ROUTE";
        document.getElementById("info-card-title").textContent = isEn ? "Connection for Kita-senju" : "北千住方面 接続案内";
        
        document.getElementById("st-origin").textContent = isEn ? "Kuzuu" : "葛生";
        document.getElementById("lbl-origin-line").textContent = isEn ? "Tobu Sano Line" : "東武佐野線";
        document.getElementById("st-transfer").textContent = isEn ? "Tatebayashi Sta." : "館林駅 乗り換え";
        document.getElementById("pf-transfer").textContent = isEn ? "Inbound" : "上り";
        document.getElementById("st-dest").textContent = isEn ? "Kita-senju Arr." : "北千住駅 到着";
        document.getElementById("lbl-dest-arr").textContent = isEn ? "Est. Arrival" : "到着予定";

        const nextRoute = senjuFullRoutes.find(r => {
          const [h, m] = r.kuzuDep.split(":").map(Number);
          return (h * 60 + m) > currentMin || ((h * 60 + m) === currentMin && currentSec === 0);
        });

        if (nextRoute) {
          document.getElementById("origin-dep-time").textContent = nextRoute.kuzuDep;
          document.getElementById("transfer-time").textContent = nextRoute.tateArr === "---" ? (isEn ? "Direct" : "直通") : `${nextRoute.tateArr} / ${nextRoute.tateDep}`;
          document.getElementById("lbl-transfer-info").textContent = isEn ? nextRoute.noteEn : nextRoute.noteJa;
          document.getElementById("dest-arr-time").textContent = nextRoute.senjuArr;

          const [h, m] = nextRoute.kuzuDep.split(":").map(Number);
          const diffSec = ((h * 60 + m) * 60) - (currentMin * 60 + currentSec);
          countdownEl.textContent = `${isEn ? "In " : "あと "}${String(Math.floor(diffSec/60)).padStart(2,'0')}:${String(diffSec%60).padStart(2,'0')}`;
        } else {
          resetFlow("--:--", isEn ? "End of Service" : "本日の運転は終了いたしました", "--:--", isEn);
        }

      } else if (displayMode === 2) {
        // --- 佐野駅乗り換え（JR両毛線・小山方面：下り/2番線） ---
        document.getElementById("card-badge").textContent = "OYAMA ROUTE";
        document.getElementById("info-card-title").textContent = "佐野駅乗り換え ➔ JR両毛線（小山方面）接続";
        
        document.getElementById("st-origin").textContent = "葛生";
        document.getElementById("lbl-origin-line").textContent = "東武佐野線";
        document.getElementById("st-transfer").textContent = "佐野駅 乗り換え";
        document.getElementById("pf-transfer").textContent = "2番線 (下り)";
        document.getElementById("st-dest").textContent = "小山駅 到着";
        document.getElementById("lbl-dest-arr").textContent = "到着予定";

        const nextRoute = sanoOyamaRoutes.find(r => {
          const [h, m] = r.kuzuDep.split(":").map(Number);
          return (h * 60 + m) > currentMin || ((h * 60 + m) === currentMin && currentSec === 0);
        });

        if (nextRoute) {
          document.getElementById("origin-dep-time").textContent = nextRoute.kuzuDep;
          document.getElementById("transfer-time").textContent = `${nextRoute.sanoArr} / ${nextRoute.sanoDep}`;
          document.getElementById("lbl-transfer-info").textContent = nextRoute.lineJa;
          document.getElementById("dest-arr-time").textContent = nextRoute.oyamaArr;

          const [h, m] = nextRoute.kuzuDep.split(":").map(Number);
          const diffSec = ((h * 60 + m) * 60) - (currentMin * 60 + currentSec);
          countdownEl.textContent = `あと ${String(Math.floor(diffSec/60)).padStart(2,'0')}:${String(diffSec%60).padStart(2,'0')}`;
        } else {
          resetFlow("--:--", "本日の運転は終了いたしました", "--:--", false);
        }

      } else if (displayMode === 3) {
        // --- 佐野駅乗り換え（JR両毛線・高崎方面：上り/1番線） ---
        document.getElementById("card-badge").textContent = "TAKASAKI ROUTE";
        document.getElementById("info-card-title").textContent = "佐野駅乗り換え ➔ JR両毛線（高崎方面）接続";
        
        document.getElementById("st-origin").textContent = "葛生";
        document.getElementById("lbl-origin-line").textContent = "東武佐野線";
        document.getElementById("st-transfer").textContent = "佐野駅 乗り換え";
        document.getElementById("pf-transfer").textContent = "1番線 (上り)";
        document.getElementById("st-dest").textContent = "高崎駅 到着";
        document.getElementById("lbl-dest-arr").textContent = "到着予定";

        const nextRoute = sanoTakasakiRoutes.find(r => {
          const [h, m] = r.kuzuDep.split(":").map(Number);
          return (h * 60 + m) > currentMin || ((h * 60 + m) === currentMin && currentSec === 0);
        });

        if (nextRoute) {
          document.getElementById("origin-dep-time").textContent = nextRoute.kuzuDep;
          document.getElementById("transfer-time").textContent = `${nextRoute.sanoArr} / ${nextRoute.sanoDep}`;
          document.getElementById("lbl-transfer-info").textContent = nextRoute.lineJa;
          document.getElementById("dest-arr-time").textContent = nextRoute.takasakiArr;

          const [h, m] = nextRoute.kuzuDep.split(":").map(Number);
          const diffSec = ((h * 60 + m) * 60) - (currentMin * 60 + currentSec);
          countdownEl.textContent = `あと ${String(Math.floor(diffSec/60)).padStart(2,'0')}:${String(diffSec%60).padStart(2,'0')}`;
        } else {
          resetFlow("--:--", "本日の運転は終了いたしました", "--:--", false);
        }
      }
    }

    function resetFlow(t1, t2, t3, isEn) {
      document.getElementById("origin-dep-time").textContent = t1;
      document.getElementById("transfer-time").textContent = t2;
      document.getElementById("dest-arr-time").textContent = t3;
      document.getElementById("lbl-transfer-info").textContent = "---";
      document.getElementById("info-countdown").textContent = isEn ? "Finished" : "終電終了";
    }

    function setRowData(prefix, data, isEn) {
      if (data) {
        document.getElementById(`${prefix}-time`).textContent = data.time;
        document.getElementById(`${prefix}-dest`).textContent = isEn ? data.destEn : data.destJa;
        document.getElementById(`${prefix}-cars`).innerHTML = `${data.cars}<span class="cars-unit">${isEn ? 'Cars' : '両'}</span>`;
        document.getElementById(`${prefix}-badge`).textContent = isEn ? data.typeEn : data.typeJa;
        document.getElementById(`${prefix}-badge`).className = `train-badge ${data.badge}`;
      } else {
        setRowDataFinished(prefix, isEn);
      }
    }

    function setRowDataFinished(prefix, isEn) {
      document.getElementById(`${prefix}-time`).textContent = "--:--";
      document.getElementById(`${prefix}-dest`).textContent = isEn ? "End of today's service" : "本日の運転は終了いたしました";
      document.getElementById(`${prefix}-cars`).innerHTML = `--<span class="cars-unit">${isEn ? 'Cars' : '両'}</span>`;
      document.getElementById(`${prefix}-badge`).textContent = isEn ? "End" : "終了";
      document.getElementById(`${prefix}-badge`).className = "train-badge badge-end";
    }

    setInterval(updateMonitor, 1000);
    updateMonitor();
  </script>
