<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>葛生駅 リアルタイム発車案内ディスプレイ</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Noto+Sans+JP:wght@700;900&display=swap');

    :root {
      --bg-board: #000000;
      --border-outer: #222222;
      --text-white: #ffffff;
      --text-yellow: #ffcc00;
      --text-orange: #ff9900;
      --text-gray: #aaaaaa;
      --badge-ltd: #d90429;
      --badge-local: #ffffff;
      --delay-red: #ff3333;
      --ok-green: #00ff66;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #0d0d0d;
      color: var(--text-white);
      font-family: 'Noto Sans JP', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .board-container {
      background-color: var(--bg-board);
      width: 100%;
      max-width: 1100px;
      border: 12px solid var(--border-outer);
      border-radius: 8px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.9);
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    .board-container.is-delayed {
      border-color: var(--delay-red);
      animation: pulse-border 2s infinite;
    }

    @keyframes pulse-border {
      0% { border-color: #ff3333; }
      50% { border-color: #660000; }
      100% { border-color: #ff3333; }
    }

    /* 上部ホーム案内 */
    .top-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #333;
      height: 50px;
      margin-bottom: 15px;
    }

    .banner-left {
      display: flex;
      align-items: center;
    }

    .platform-num {
      background: linear-gradient(135deg, #111, #333);
      color: #fff;
      font-size: 2rem;
      font-weight: 900;
      width: 55px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
      border-right: 6px solid #f60;
      margin-right: 15px;
      font-family: 'Chakra Petch', sans-serif;
      flex-shrink: 0;
    }

    .banner-text {
      font-size: 1.25rem;
      color: #ddd;
      font-weight: bold;
      line-height: 50px;
      height: 50px;
      display: flex;
      align-items: center;
    }

    /* 音声トグルボタン */
    .audio-btn {
      background: #222;
      color: #ffcc00;
      border: 1px solid #ffcc00;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .audio-btn.enabled {
      background: #00ff66;
      color: #000;
      border-color: #00ff66;
    }

    /* テーブルヘッダー */
    .board-header {
      display: grid;
      grid-template-columns: 220px 180px 1fr 140px;
      color: var(--text-gray);
      font-size: 0.95rem;
      border-bottom: 1px solid #444;
      height: 30px;
      line-height: 30px;
      text-align: center;
    }

    /* 発車行 */
    .board-row {
      display: grid;
      grid-template-columns: 220px 180px 1fr 140px;
      align-items: center;
      border-bottom: 1px solid #222;
      text-align: center;
      height: 85px;
    }

    .dept-time {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 3.5rem;
      font-weight: 700;
      color: var(--text-white);
      line-height: 85px;
    }

    .badge-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
    }

    .train-badge {
      width: 140px;
      height: 42px;
      line-height: 42px;
      font-size: 1.3rem;
      font-weight: 900;
      border-radius: 4px;
      text-align: center;
    }

    .badge-ltd { background-color: var(--badge-ltd); color: #fff; }
    .badge-local { background-color: var(--badge-local); color: #000; }
    .badge-end { background-color: #333333; color: #aaaaaa; }

    .destination {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--text-white);
      text-align: left;
      padding-left: 30px;
      line-height: 85px;
      white-space: nowrap;
    }

    .cars-info {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--text-white);
      line-height: 85px;
    }

    .cars-unit { font-size: 1.1rem; font-weight: normal; margin-left: 4px; }

    /* 運行状況テロップバー */
    .notice-bar {
      background-color: #111;
      color: var(--ok-green);
      border: 1px solid #333;
      height: 48px;
      margin: 15px 0;
      font-size: 1.2rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .notice-bar.has-delay {
      background-color: #4a0000;
      color: #ffffff;
      border-color: var(--delay-red);
      font-size: 1.35rem;
    }

    /* 下段マルチ接続カード */
    .info-section {
      background: #060b18;
      border: 2px solid #1c2d4a;
      border-radius: 8px;
      padding: 12px 18px;
      height: 185px;
    }

    .info-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 32px;
      margin-bottom: 8px;
    }

    .info-title-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .route-badge {
      background: linear-gradient(135deg, #0088ff, #0055cc);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 4px;
      font-family: 'Chakra Petch', sans-serif;
      letter-spacing: 0.5px;
    }

    .info-title-text {
      color: #38bdf8;
      font-size: 1.25rem;
      font-weight: 900;
    }

    .info-countdown-box {
      background: #000;
      border: 1px solid #2a3a57;
      padding: 4px 14px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 1.25rem;
      color: var(--ok-green);
      font-weight: bold;
    }

    .info-connection-flow {
      display: grid;
      grid-template-columns: 1fr 28px 1.5fr 28px 1fr;
      align-items: center;
      gap: 6px;
      height: 115px;
    }

    .step-card {
      background: #111625;
      border: 1px solid #233555;
      border-radius: 6px;
      padding: 8px 6px;
      height: 115px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }

    .step-card.highlight {
      background: #0f1c33;
      border-color: #38bdf8;
    }

    .step-station-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
    }

    .step-station-name {
      font-size: 1.05rem;
      color: #e2e8f0;
      font-weight: 900;
    }

    .platform-badge {
      background: #ffcc00;
      color: #000;
      font-size: 0.75rem;
      font-weight: 900;
      padding: 1px 6px;
      border-radius: 3px;
    }

    .step-time-main {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 2.1rem;
      font-weight: 700;
      color: var(--text-yellow);
      line-height: 1.1;
    }

    .step-time-transfer {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-orange);
      line-height: 1.1;
      white-space: nowrap;
    }

    .step-sub-label {
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .arrow {
      color: #38bdf8;
      font-size: 1.4rem;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>

    // ★ Web Audio API によるチャイム生成（ピン・ポン♪） ★
    function playChime() {
      if (!audioEnabled) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const now = audioCtx.currentTime;

        // 1音目 (ミ: E5 / 659.25 Hz)
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(659.25, now);
        gain1.gain.setValueAtTime(0.3, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.8);

        // 2音目 (ド: C5 / 523.25 Hz - 0.35秒後)
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(523.25, now + 0.35);
        gain2.gain.setValueAtTime(0.3, now + 0.35);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.35);
        osc2.stop(now + 1.2);

      } catch (e) {
        console.warn("Audio error:", e);
      }
    }

        btn.classList.add("enabled");
        playChime(); // テスト鳴動
      } else {
        btn.textContent = "🔊 音声: OFF (クリックで有効化)";
        btn.classList.remove("enabled");
      }
    }

      { "time": "21:50", "sanoArr": "22:07", "oyamaDep": "22:58", "oyamaArr": "23:23", "takasakiDep": "---",   "takasakiArr": "---",   "tateArr": "22:25", "senjuDep": "22:34", "senjuArr": "23:45", "typeJa": "普通", "typeEn": "Local", "badge": "badge-local", "destJa": "館林", "destEn": "Tatebayashi", "cars": "2" },
      { "time": "22:13", "sanoArr": "22:30", "oyamaDep": "22:58", "oyamaArr": "23:23", "takasakiDep": "---",   "takasakiArr": "---",   "tateArr": "22:48", "senjuDep": "---",   "senjuArr": "---",   "typeJa": "普通", "typeEn": "Local", "badge": "badge-local", "destJa": "館林", "destEn": "Tatebayashi", "cars": "2" },
      { "time": "23:02", "sanoArr": "23:19", "oyamaDep": "---",   "oyamaArr": "---",   "takasakiDep": "---",   "takasakiArr": "---",   "tateArr": "23:37", "senjuDep": "---",   "senjuArr": "---",   "typeJa": "普通", "typeEn": "Local", "badge": "badge-local", "destJa": "館林", "destEn": "Tatebayashi", "cars": "2" }
    ];

    // 4秒ごとにモードをローテーション
    setInterval(() => {
      displayMode = (displayMode + 1) % 4;
      updateHeaderTexts();
      updateMonitor();
    }, 4000);

    function updateHeaderTexts() {
      const isEnglish = (displayMode === 1);
      document.getElementById("hdr-dept").textContent = isEnglish ? "Departure time" : "発車時刻";
      document.getElementById("hdr-train").textContent = isEnglish ? "Train" : "種別";
      document.getElementById("hdr-to").textContent = isEnglish ? "To" : "行先";
      document.getElementById("hdr-cars").textContent = isEnglish ? "Cars" : "両数";
      
      document.getElementById("m1-unit").textContent = isEnglish ? "Cars" : "両";
      document.getElementById("m2-unit").textContent = isEnglish ? "Cars" : "両";
      document.getElementById("m3-unit").textContent = isEnglish ? "Cars" : "両";

      document.getElementById("top-banner-text").textContent = isEnglish 
        ? "for Sano, Tatebayashi, Asakusa"
        : "佐野・館林・浅草 方面";
    }

    function updateMonitor() {
      const now = new Date();
      const currentMin = now.getHours() * 60 + now.getMinutes();
      const currentSec = now.getSeconds();

      // 1. 上部 発車標の更新
      const upcomingMy = masterConnections.filter(r => {
        const [h, m] = r.time.split(":").map(Number);
        return (h * 60 + m) > currentMin || ((h * 60 + m) === currentMin && currentSec === 0);
      });

      const isEnglishMode = (displayMode === 1);

      if (upcomingMy.length === 0) {
        document.getElementById("notice-text").textContent = isEnglishMode 
          ? "【Notice】 End of today's train service."
          : "【案内】本日の電車は終了いたしました。";
          
        setRowDataFinished("m1", isEnglishMode);
        setRowDataFinished("m2", isEnglishMode);
        setRowDataFinished("m3", isEnglishMode);
      } else {
        document.getElementById("notice-text").textContent = isEnglishMode
          ? "【Status】 Tobu Sano Line / JR Ryomo Line: Normal Operation"
          : "【運行状況】東武佐野線・JR両毛線：平常運転";

        setRowData("m1", upcomingMy[0], isEnglishMode);
        setRowData("m2", upcomingMy[1], isEnglishMode);
        setRowData("m3", upcomingMy[2], isEnglishMode);

        // ★ 先発便の「10秒前チャイム判定」 ★
        const nextTrain = upcomingMy[0];
        const [th, tm] = nextTrain.time.split(":").map(Number);
        const trainTotalSec = (th * 60 + tm) * 60;
        const currentTotalSec = currentMin * 60 + currentSec;
        const diffSec = trainTotalSec - currentTotalSec;

        // 10秒前かつ、今発車便に対して未再生の場合にチャイム鳴動
        if (diffSec === 10 && lastChimeTime !== nextTrain.time) {
          playChime();
          lastChimeTime = nextTrain.time;
        }
      }

      // 2. 下段 マルチ接続カードの更新
      const countdownEl = document.getElementById("info-countdown");

      if (displayMode === 0 || displayMode === 1) {
        // --- 北千住方面 ---
        const isEn = (displayMode === 1);
        document.getElementById("card-badge").textContent = "TOKYO ROUTE";
        document.getElementById("info-card-title").textContent = isEn ? "Connection for Kita-senju" : "北千住方面 接続案内";
        
        document.getElementById("st-origin").textContent = isEn ? "Kuzuu" : "葛生";
        document.getElementById("lbl-origin-line").textContent = isEn ? "Tobu Sano Line" : "東武佐野線";
        document.getElementById("st-transfer").textContent = isEn ? "Tatebayashi Sta." : "館林駅 乗り換え";
        document.getElementById("pf-transfer").textContent = isEn ? "Inbound" : "上り";
        document.getElementById("st-dest").textContent = isEn ? "Kita-senju Arr." : "北千住駅 到着";
        document.getElementById("lbl-dest-arr").textContent = isEn ? "Est. Arrival" : "到着予定";

        const nextRoute = masterConnections.find(r => {
          const [h, m] = r.time.split(":").map(Number);
          return (h * 60 + m) > currentMin || ((h * 60 + m) === currentMin && currentSec === 0);
        });

        if (nextRoute && nextRoute.senjuDep !== "---") {
          document.getElementById("origin-dep-time").textContent = nextRoute.time;
          document.getElementById("transfer-time").textContent = `${nextRoute.tateArr} / ${nextRoute.senjuDep}`;
          document.getElementById("lbl-transfer-info").textContent = isEn ? "Tobu Skytree Line" : (nextRoute.time === "08:01" ? "特急リバティ(直通)" : "東武スカイツリーライン");
          document.getElementById("dest-arr-time").textContent = nextRoute.senjuArr;

          const [h, m] = nextRoute.time.split(":").map(Number);
          const diffSec = ((h * 60 + m) * 60) - (currentMin * 60 + currentSec);
          countdownEl.textContent = `${isEn ? "In " : "あと "}${String(Math.floor(diffSec/60)).padStart(2,'0')}:${String(diffSec%60).padStart(2,'0')}`;
        } else {
          resetFlow("--:--", isEn ? "No Service Today" : "本日の接続は終了しました", "--:--", isEn);
        }

      } else if (displayMode === 2) {
        // --- 佐野駅乗り換え（JR両毛線・小山方面：下り/2番線） ---
        document.getElementById("card-badge").textContent = "OYAMA ROUTE";
        document.getElementById("info-card-title").textContent = "佐野駅乗り換え ➔ JR両毛線（小山方面）接続";
        
        document.getElementById("st-origin").textContent = "葛生";
        document.getElementById("lbl-origin-line").textContent = "東武佐野線";
        document.getElementById("st-transfer").textContent = "佐野駅 乗り換え";
        document.getElementById("pf-transfer").textContent = "2番線 (下り)";
        document.getElementById("st-dest").textContent = "小山駅 到着";
        document.getElementById("lbl-dest-arr").textContent = "到着予定";

        const nextRoute = masterConnections.find(r => {
          const [h, m] = r.time.split(":").map(Number);
          return (h * 60 + m) > currentMin || ((h * 60 + m) === currentMin && currentSec === 0);
        });

        if (nextRoute && nextRoute.oyamaDep !== "---") {
          document.getElementById("origin-dep-time").textContent = nextRoute.time;
          document.getElementById("transfer-time").textContent = `${nextRoute.sanoArr} / ${nextRoute.oyamaDep}`;
          document.getElementById("lbl-transfer-info").textContent = "JR両毛線 (小山行)";
          document.getElementById("dest-arr-time").textContent = nextRoute.oyamaArr;

          const [h, m] = nextRoute.time.split(":").map(Number);
          const diffSec = ((h * 60 + m) * 60) - (currentMin * 60 + currentSec);
          countdownEl.textContent = `あと ${String(Math.floor(diffSec/60)).padStart(2,'0')}:${String(diffSec%60).padStart(2,'0')}`;
        } else {
          resetFlow("--:--", "本日の接続は終了しました", "--:--", false);
        }

      } else if (displayMode === 3) {
        // --- 佐野駅乗り換え（JR両毛線・高崎方面：上り/1番線） ---
        document.getElementById("card-badge").textContent = "TAKASAKI ROUTE";
        document.getElementById("info-card-title").textContent = "佐野駅乗り換え ➔ JR両毛線（高崎方面）接続";
        
        document.getElementById("st-origin").textContent = "葛生";
        document.getElementById("lbl-origin-line").textContent = "東武佐野線";
        document.getElementById("st-transfer").textContent = "佐野駅 乗り換え";
        document.getElementById("pf-transfer").textContent = "1番線 (上り)";
        document.getElementById("st-dest").textContent = "高崎駅 到着";
        document.getElementById("lbl-dest-arr").textContent = "到着予定";

        const nextRoute = masterConnections.find(r => {
          const [h, m] = r.time.split(":").map(Number);
          return (h * 60 + m) > currentMin || ((h * 60 + m) === currentMin && currentSec === 0);
        });

        if (nextRoute && nextRoute.takasakiDep !== "---") {
          document.getElementById("origin-dep-time").textContent = nextRoute.time;
          document.getElementById("transfer-time").textContent = `${nextRoute.sanoArr} / ${nextRoute.takasakiDep}`;
          document.getElementById("lbl-transfer-info").textContent = "JR両毛線 (高崎方面)";
          document.getElementById("dest-arr-time").textContent = nextRoute.takasakiArr;

          const [h, m] = nextRoute.time.split(":").map(Number);
          const diffSec = ((h * 60 + m) * 60) - (currentMin * 60 + currentSec);
          countdownEl.textContent = `あと ${String(Math.floor(diffSec/60)).padStart(2,'0')}:${String(diffSec%60).padStart(2,'0')}`;
        } else {
          resetFlow("--:--", "本日の接続は終了しました", "--:--", false);
        }
      }
    }

    function resetFlow(t1, t2, t3, isEn) {
      document.getElementById("origin-dep-time").textContent = t1;
      document.getElementById("transfer-time").textContent = t2;
      document.getElementById("dest-arr-time").textContent = t3;
      document.getElementById("lbl-transfer-info").textContent = "---";
      document.getElementById("info-countdown").textContent = isEn ? "Finished" : "終電終了";
    }

    function setRowData(prefix, data, isEn) {
      if (data) {
        document.getElementById(`${prefix}-time`).textContent = data.time;
        document.getElementById(`${prefix}-dest`).textContent = isEn ? data.destEn : data.destJa;
        document.getElementById(`${prefix}-cars`).innerHTML = `${data.cars}<span class="cars-unit">${isEn ? 'Cars' : '両'}</span>`;
        document.getElementById(`${prefix}-badge`).textContent = isEn ? data.typeEn : data.typeJa;
        document.getElementById(`${prefix}-badge`).className = `train-badge ${data.badge}`;
      } else {
        setRowDataFinished(prefix, isEn);
      }
    }

    function setRowDataFinished(prefix, isEn) {
      document.getElementById(`${prefix}-time`).textContent = "--:--";
      document.getElementById(`${prefix}-dest`).textContent = isEn ? "End of today's service" : "本日の運転は終了いたしました";
      document.getElementById(`${prefix}-cars`).innerHTML = `--<span class="cars-unit">${isEn ? 'Cars' : '両'}</span>`;
      document.getElementById(`${prefix}-badge`).textContent = isEn ? "End" : "終了";
      document.getElementById(`${prefix}-badge`).className = "train-badge badge-end";
    }

    setInterval(updateMonitor, 1000);
    updateMonitor();
  </script>
