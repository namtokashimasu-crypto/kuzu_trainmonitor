<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>葛生駅 リアルタイム発車案内ディスプレイ</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Noto+Sans+JP:wght@700;900&display=swap');

    :root {
      --bg-board: #000000;
      --border-outer: #222222;
      --text-white: #ffffff;
      --text-yellow: #ffcc00;
      --text-orange: #ff9900;
      --text-gray: #aaaaaa;
      --badge-ltd: #d90429;     /* 特急レッド */
      --badge-local: #ffffff;   /* 普通ホワイト */
      --delay-red: #ff3333;
      --ok-green: #00ff66;
    }

    * { 
      box-sizing: border-box; 
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0d0d;
      color: var(--text-white);
      font-family: 'Noto Sans JP', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* 画面全体枠 */
    .board-container {
      background-color: var(--bg-board);
      width: 100%;
      max-width: 1100px;
      border: 12px solid var(--border-outer);
      border-radius: 8px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.9);
      padding: 20px;
      overflow: hidden;
    }

    .board-container.is-delayed {
      border-color: var(--delay-red);
      animation: pulse-border 2s infinite;
    }

    @keyframes pulse-border {
      0% { border-color: #ff3333; }
      50% { border-color: #660000; }
      100% { border-color: #ff3333; }
    }

    /* 上部ホーム案内 */
    .top-banner {
      display: flex;
      align-items: center;
      border-bottom: 2px solid #333;
      height: 50px;
      margin-bottom: 15px;
    }

    .platform-num {
      background: linear-gradient(135deg, #111, #333);
      color: #fff;
      font-size: 2rem;
      font-weight: 900;
      width: 55px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
      border-right: 6px solid #f60;
      margin-right: 15px;
      font-family: 'Chakra Petch', sans-serif;
      flex-shrink: 0;
    }

    .banner-text {
      font-size: 1.25rem;
      color: #ddd;
      font-weight: bold;
      line-height: 50px;
      height: 50px;
      display: flex;
      align-items: center;
    }

    /* テーブルヘッダー */
    .board-header {
      display: grid;
      grid-template-columns: 220px 180px 1fr 140px;
      color: var(--text-gray);
      font-size: 0.95rem;
      border-bottom: 1px solid #444;
      height: 30px;
      line-height: 30px;
      text-align: center;
    }

    /* 発車行 */
    .board-row {
      display: grid;
      grid-template-columns: 220px 180px 1fr 140px;
      align-items: center;
      border-bottom: 1px solid #222;
      text-align: center;
      height: 85px;
    }

    .dept-time {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 3.5rem;
      font-weight: 700;
      color: var(--text-white);
      line-height: 85px;
    }

    .badge-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
    }

    .train-badge {
      width: 140px;
      height: 42px;
      line-height: 42px;
      font-size: 1.3rem;
      font-weight: 900;
      border-radius: 4px;
      text-align: center;
    }

    .badge-ltd { background-color: var(--badge-ltd); color: #fff; }
    .badge-local { background-color: var(--badge-local); color: #000; }

    .destination {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--text-white);
      text-align: left;
      padding-left: 30px;
      line-height: 85px;
      white-space: nowrap;
    }

    .cars-info {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--text-white);
      line-height: 85px;
    }

    .cars-unit { font-size: 1.1rem; font-weight: normal; margin-left: 4px; }

    /* 運行状況テロップバー */
    .notice-bar {
      background-color: #111;
      color: var(--ok-green);
      border: 1px solid #333;
      height: 48px;
      margin: 15px 0;
      font-size: 1.2rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .notice-bar.has-delay {
      background-color: #4a0000;
      color: #ffffff;
      border-color: var(--delay-red);
      font-size: 1.35rem;
    }

    /* 下段マルチ接続カード（固定高さ設計） */
    .info-section {
      background: #080d1a;
      border: 2px solid #1a2a47;
      border-radius: 8px;
      padding: 14px 18px;
      height: 175px;
    }

    .info-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 32px;
      margin-bottom: 10px;
    }

    .info-title-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .route-badge {
      background: linear-gradient(135deg, #1da1f2, #0066cc);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 4px;
      font-family: 'Chakra Petch', sans-serif;
    }

    .info-title-text {
      color: #38bdf8;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .info-countdown-box {
      background: #000;
      border: 1px solid #2a3a57;
      padding: 4px 12px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 1.2rem;
      color: var(--ok-green);
      font-weight: bold;
    }

    .info-connection-flow {
      display: grid;
      grid-template-columns: 1fr 30px 1.5fr 30px 1fr;
      align-items: center;
      background: #000;
      border: 1px solid #223355;
      padding: 10px 15px;
      border-radius: 6px;
      height: 100px;
    }

    .step-box { text-align: center; }
    .step-station { font-size: 0.85rem; color: var(--text-gray); font-weight: bold; height: 22px; }
    .step-time {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--text-yellow);
      height: 38px;
      line-height: 38px;
      white-space: nowrap;
    }
    .step-label { font-size: 0.85rem; color: #fff; height: 22px; line-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .platform-badge {
      display: inline-block;
      background: #222;
      color: #ffcc00;
      border: 1px solid #ffcc00;
      font-size: 0.75rem;
      padding: 1px 5px;
      border-radius: 3px;
      margin-left: 4px;
    }
    
    .arrow { color: #38bdf8; font-size: 1.5rem; font-weight: bold; text-align: center; }
  </style>
</head>

      { kuzuDep: "06:18", sanoArr: "06:26", sanoDep: "06:37", oyamaArr: "07:11", lineJa: "JR両毛線 (小山行)", lineEn: "JR Ryomo Line for Oyama" },
      { kuzuDep: "06:48", sanoArr: "06:56", sanoDep: "07:07", oyamaArr: "07:38", lineJa: "JR両毛線 (小山行)", lineEn: "JR Ryomo Line for Oyama" },
      { kuzuDep: "07:22", sanoArr: "07:30", sanoDep: "07:39", oyamaArr: "08:14", lineJa: "JR両毛線 (小山行)", lineEn: "JR Ryomo Line for Oyama" },
      { kuzuDep: "07:54", sanoArr: "08:02", sanoDep: "08:13", oyamaArr: "08:48", lineJa: "JR両毛線 (小山行)", lineEn: "JR Ryomo Line for Oyama" },
      { kuzuDep: "08:34", sanoArr: "08:42", sanoDep: "08:52", oyamaArr: "09:25", lineJa: "JR両毛線 (小山行)", lineEn: "JR Ryomo Line for Oyama" },
      { kuzuDep: "16:15", sanoArr: "16:23", sanoDep: "16:32", oyamaArr: "17:04", lineJa: "JR両毛線 (小山行)", lineEn: "JR Ryomo Line for Oyama" },
      { kuzuDep: "17:10", sanoArr: "17:18", sanoDep: "17:31", oyamaArr: "18:04", lineJa: "JR両毛線 (小山行)", lineEn: "JR Ryomo Line for Oyama" },
      { kuzuDep: "18:05", sanoArr: "18:13", sanoDep: "18:22", oyamaArr: "18:55", lineJa: "JR両毛線 (小山行)", lineEn: "JR Ryomo Line for Oyama" },
      { kuzuDep: "19:12", sanoArr: "19:20", sanoDep: "19:28", oyamaArr: "20:00", lineJa: "JR両毛線 (小山行)", lineEn: "JR Ryomo Line for Oyama" }
    ];

    // ③ 佐野駅乗り換え JR両毛線（高崎方面）接続データ
    const sanoTakasakiRoutes = [
      { kuzuDep: "06:18", sanoArr: "06:26", sanoDep: "06:33", takasakiArr: "08:01", lineJa: "JR両毛線 (高崎行)", lineEn: "JR Ryomo Line for Takasaki" },
      { kuzuDep: "07:22", sanoArr: "07:30", sanoDep: "07:36", takasakiArr: "09:07", lineJa: "JR両毛線 (高崎行)", lineEn: "JR Ryomo Line for Takasaki" },
      { kuzuDep: "08:34", sanoArr: "08:42", sanoDep: "08:48", takasakiArr: "10:14", lineJa: "JR両毛線 (高崎行)", lineEn: "JR Ryomo Line for Takasaki" },
      { kuzuDep: "16:15", sanoArr: "16:23", sanoDep: "16:34", takasakiArr: "18:03", lineJa: "JR両毛線 (高崎行)", lineEn: "JR Ryomo Line for Takasaki" },
      { kuzuDep: "18:05", sanoArr: "18:13", sanoDep: "18:24", takasakiArr: "19:54", lineJa: "JR両毛線 (高崎行)", lineEn: "JR Ryomo Line for Takasaki" },
      { kuzuDep: "19:12", sanoArr: "19:20", sanoDep: "19:27", takasakiArr: "20:54", lineJa: "JR両毛線 (高崎行)", lineEn: "JR Ryomo Line for Takasaki" }
    ];

    // 4秒ごとにモードをローテーション（北千住(日) ➔ 北千住(英) ➔ 佐野・小山(日) ➔ 佐野・高崎(日)）
    setInterval(() => {
      displayMode = (displayMode + 1) % 4;
      updateHeaderTexts();
      updateMonitor();
    }, 4000);

    function updateHeaderTexts() {
      const isEnglish = (displayMode === 1);
      document.getElementById("hdr-dept").textContent = isEnglish ? "Departure time" : "発車時刻";
      document.getElementById("hdr-train").textContent = isEnglish ? "Train" : "種別";
      document.getElementById("hdr-to").textContent = isEnglish ? "To" : "行先";
      document.getElementById("hdr-cars").textContent = isEnglish ? "Cars" : "両数";
      
      document.getElementById("m1-unit").textContent = isEnglish ? "Cars" : "両";
      document.getElementById("m2-unit").textContent = isEnglish ? "Cars" : "両";
      document.getElementById("m3-unit").textContent = isEnglish ? "Cars" : "両";

      document.getElementById("top-banner-text").textContent = isEnglish 
        ? "for Sano, Tatebayashi, Asakusa"
        : "佐野・館林・浅草 方面";
    }

    function updateMonitor() {
      const now = new Date();
      const currentMin = now.getHours() * 60 + now.getMinutes();
      const currentSec = now.getSeconds();

      // 1. 上部 発車標の更新
      const upcomingMy = kuzuFullRoutes.filter(r => {
        const [h, m] = r.time.split(":").map(Number);
        return (h * 60 + m) > currentMin || ((h * 60 + m) === currentMin && currentSec === 0);
      });

      const isEnglishMode = (displayMode === 1);
      setRowData("m1", upcomingMy[0], isEnglishMode);
      setRowData("m2", upcomingMy[1], isEnglishMode);
      setRowData("m3", upcomingMy[2], isEnglishMode);

      // 2. 下段 マルチ接続カードの更新
      const countdownEl = document.getElementById("info-countdown");

      if (displayMode === 0 || displayMode === 1) {
        // --- モード0・1：北千住方面 ---
        const isEn = (displayMode === 1);
        document.getElementById("card-badge").textContent = "TOKYO ROUTE";
        document.getElementById("info-card-title").textContent = isEn ? "Connection for Kita-senju" : "北千住方面 接続案内（館林乗り換え）";
        
        document.getElementById("st-origin").textContent = isEn ? "Kuzuu" : "葛生";
        document.getElementById("lbl-origin-line").textContent = isEn ? "Tobu Sano Line" : "東武佐野線";
        document.getElementById("st-transfer").textContent = isEn ? "Tatebayashi Sta." : "館林駅 乗り換え";
        document.getElementById("st-senju").textContent = isEn ? "Kita-senju Arr." : "北千住駅 到着";
        document.getElementById("lbl-dest-arr").textContent = isEn ? "Est. Arrival" : "到着予定";

        const nextRoute = senjuFullRoutes.find(r => {
          const [h, m] = r.kuzuDep.split(":").map(Number);
          return (h * 60 + m) > currentMin || ((h * 60 + m) === currentMin && currentSec === 0);
        });

        if (nextRoute) {
          document.getElementById("origin-dep-time").textContent = nextRoute.kuzuDep;
          document.getElementById("transfer-time").textContent = nextRoute.tateArr === "---" ? (isEn ? "Direct" : "直通") : `${nextRoute.tateArr}着 / ${nextRoute.tateDep}発`;
          document.getElementById("lbl-transfer-info").textContent = isEn ? nextRoute.noteEn : nextRoute.noteJa;
          document.getElementById("dest-arr-time").textContent = nextRoute.senjuArr;

          const [h, m] = nextRoute.kuzuDep.split(":").map(Number);
          const diffSec = ((h * 60 + m) * 60) - (currentMin * 60 + currentSec);
          countdownEl.textContent = `${isEn ? "In " : "あと "}${String(Math.floor(diffSec/60)).padStart(2,'0')}:${String(diffSec%60).padStart(2,'0')}`;
        } else {
          resetFlow("--:--", "運行終了", "--:--");
        }

      } else if (displayMode === 2) {
        // --- モード2：佐野駅乗り換え（JR両毛線・小山方面） ---
        document.getElementById("card-badge").textContent = "OYAMA ROUTE";
        document.getElementById("info-card-title").textContent = "佐野駅乗り換え ➔ JR両毛線（小山方面）接続";
        
        document.getElementById("st-origin").textContent = "葛生";
        document.getElementById("lbl-origin-line").textContent = "東武佐野線";
        document.getElementById("st-transfer").textContent = "佐野駅 乗り換え";
        document.getElementById("st-senju").textContent = "小山駅 到着";
        document.getElementById("lbl-dest-arr").textContent = "到着予定";

        const nextRoute = sanoOyamaRoutes.find(r => {
          const [h, m] = r.kuzuDep.split(":").map(Number);
          return (h * 60 + m) > currentMin || ((h * 60 + m) === currentMin && currentSec === 0);
        });

        if (nextRoute) {
          document.getElementById("origin-dep-time").textContent = nextRoute.kuzuDep;
          document.getElementById("transfer-time").textContent = `${nextRoute.sanoArr}着 / ${nextRoute.sanoDep}発`;
          document.getElementById("lbl-transfer-info").textContent = nextRoute.lineJa;
          document.getElementById("dest-arr-time").textContent = nextRoute.oyamaArr;

          const [h, m] = nextRoute.kuzuDep.split(":").map(Number);
          const diffSec = ((h * 60 + m) * 60) - (currentMin * 60 + currentSec);
          countdownEl.textContent = `あと ${String(Math.floor(diffSec/60)).padStart(2,'0')}:${String(diffSec%60).padStart(2,'0')}`;
        } else {
          resetFlow("--:--", "本日の運行終了", "--:--");
        }

      } else if (displayMode === 3) {
        // --- モード3：佐野駅乗り換え（JR両毛線・高崎方面） ---
        document.getElementById("card-badge").textContent = "TAKASAKI ROUTE";
        document.getElementById("info-card-title").textContent = "佐野駅乗り換え ➔ JR両毛線（高崎方面）接続";
        
        document.getElementById("st-origin").textContent = "葛生";
        document.getElementById("lbl-origin-line").textContent = "東武佐野線";
        document.getElementById("st-transfer").textContent = "佐野駅 乗り換え";
        document.getElementById("st-senju").textContent = "高崎駅 到着";
        document.getElementById("lbl-dest-arr").textContent = "到着予定";

        const nextRoute = sanoTakasakiRoutes.find(r => {
          const [h, m] = r.kuzuDep.split(":").map(Number);
          return (h * 60 + m) > currentMin || ((h * 60 + m) === currentMin && currentSec === 0);
        });

        if (nextRoute) {
          document.getElementById("origin-dep-time").textContent = nextRoute.kuzuDep;
          document.getElementById("transfer-time").textContent = `${nextRoute.sanoArr}着 / ${nextRoute.sanoDep}発`;
          document.getElementById("lbl-transfer-info").textContent = nextRoute.lineJa;
          document.getElementById("dest-arr-time").textContent = nextRoute.takasakiArr;

          const [h, m] = nextRoute.kuzuDep.split(":").map(Number);
          const diffSec = ((h * 60 + m) * 60) - (currentMin * 60 + currentSec);
          countdownEl.textContent = `あと ${String(Math.floor(diffSec/60)).padStart(2,'0')}:${String(diffSec%60).padStart(2,'0')}`;
        } else {
          resetFlow("--:--", "本日の運行終了", "--:--");
        }
      }
    }

    function resetFlow(t1, t2, t3) {
      document.getElementById("origin-dep-time").textContent = t1;
      document.getElementById("transfer-time").textContent = t2;
      document.getElementById("dest-arr-time").textContent = t3;
      document.getElementById("info-countdown").textContent = "終了";
    }

    function setRowData(prefix, data, isEn) {
      if (data) {
        document.getElementById(`${prefix}-time`).textContent = data.time;
        document.getElementById(`${prefix}-dest`).textContent = isEn ? data.destEn : data.destJa;
        document.getElementById(`${prefix}-cars`).innerHTML = `${data.cars}<span class="cars-unit">${isEn ? 'Cars' : '両'}</span>`;
        document.getElementById(`${prefix}-badge`).textContent = isEn ? data.typeEn : data.typeJa;
        document.getElementById(`${prefix}-badge`).className = `train-badge ${data.badge}`;
      } else {
        document.getElementById(`${prefix}-time`).textContent = "--:--";
        document.getElementById(`${prefix}-dest`).textContent = isEn ? "Terminated" : "終了";
        document.getElementById(`${prefix}-cars`).innerHTML = `--<span class="cars-unit">${isEn ? 'Cars' : '両'}</span>`;
      }
    }

    setInterval(updateMonitor, 1000);
    updateMonitor();
  </script>
</body>
</html>
