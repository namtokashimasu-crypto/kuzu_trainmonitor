<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>葛生駅 リアルタイム発車案内ディスプレイ</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Noto+Sans+JP:wght@700;900&display=swap');

    :root {
      --bg-board: #000000;
      --border-outer: #222222;
      --text-white: #ffffff;
      --text-yellow: #ffcc00;
      --text-orange: #ff9900;
      --text-gray: #aaaaaa;
      --badge-ltd: #d90429;
      --badge-local: #ffffff;
      --delay-red: #ff3333;
      --ok-green: #00ff66;
    }

    * { 
      box-sizing: border-box; 
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0d0d;
      color: var(--text-white);
      font-family: 'Noto Sans JP', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* 画面全体枠（幅固定＆ガタつき防止） */
    .board-container {
      background-color: var(--bg-board);
      width: 100%;
      max-width: 1100px;
      border: 12px solid var(--border-outer);
      border-radius: 8px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.9);
      padding: 20px;
      overflow: hidden;
    }

    /* 上部ホーム案内（固定高） */
    .top-banner {
      display: flex;
      align-items: center;
      border-bottom: 2px solid #333;
      height: 50px;
      margin-bottom: 15px;
    }

    .platform-num {
      background: linear-gradient(135deg, #111, #333);
      color: #fff;
      font-size: 2rem;
      font-weight: 900;
      width: 55px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
      border-right: 6px solid #f60;
      margin-right: 15px;
      font-family: 'Chakra Petch', sans-serif;
      flex-shrink: 0;
    }

    .banner-text {
      font-size: 1.25rem;
      color: #ddd;
      font-weight: bold;
      line-height: 50px;
      height: 50px;
      display: flex;
      align-items: center;
    }

    /* テーブルヘッダー（絶対比率固定） */
    .board-header {
      display: grid;
      grid-template-columns: 220px 180px 1fr 140px;
      color: var(--text-gray);
      font-size: 0.95rem;
      border-bottom: 1px solid #444;
      height: 30px;
      line-height: 30px;
      text-align: center;
    }

    /* 発車行（完全に高さを固定して画面揺れを封殺） */
    .board-row {
      display: grid;
      grid-template-columns: 220px 180px 1fr 140px;
      align-items: center;
      border-bottom: 1px solid #222;
      text-align: center;
      height: 85px;
    }

    .dept-time {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 3.5rem;
      font-weight: 700;
      color: var(--text-white);
      line-height: 85px;
    }

    .badge-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
    }

    .train-badge {
      width: 140px;
      height: 42px;
      line-height: 42px;
      font-size: 1.3rem;
      font-weight: 900;
      border-radius: 4px;
      text-align: center;
    }

    .badge-ltd { background-color: var(--badge-ltd); color: #fff; }
    .badge-local { background-color: var(--badge-local); color: #000; }

    .destination {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--text-white);
      text-align: left;
      padding-left: 30px;
      line-height: 85px;
      white-space: nowrap;
    }

    .cars-info {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--text-white);
      line-height: 85px;
    }

    .cars-unit { font-size: 1.1rem; font-weight: normal; margin-left: 4px; }

    /* 運行状況テロップバー（高さ固定） */
    .notice-bar {
      background-color: #111;
      color: var(--ok-green);
      border: 1px solid #333;
      height: 48px;
      margin: 15px 0;
      font-size: 1.2rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 北千住接続カード（固定高さ設計） */
    .senju-section {
      background: #080d1a;
      border: 2px solid #1a2a47;
      border-radius: 8px;
      padding: 14px 18px;
      height: 175px;
    }

    .senju-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 32px;
      margin-bottom: 10px;
    }

    .senju-title-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .route-badge {
      background: linear-gradient(135deg, #1da1f2, #0066cc);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 4px;
      font-family: 'Chakra Petch', sans-serif;
    }

    .senju-title-text {
      color: #38bdf8;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .senju-countdown-box {
      background: #000;
      border: 1px solid #2a3a57;
      padding: 4px 12px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 1.2rem;
      color: var(--ok-green);
      font-weight: bold;
    }

    .senju-connection-flow {
      display: grid;
      grid-template-columns: 1fr 40px 1.4fr 40px 1fr;
      align-items: center;
      background: #000;
      border: 1px solid #223355;
      padding: 10px 15px;
      border-radius: 6px;
      height: 100px;
    }

    .step-box { text-align: center; }
    .step-station { font-size: 0.9rem; color: var(--text-gray); font-weight: bold; height: 22px; }
    .step-time {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.9rem;
      font-weight: bold;
      color: var(--text-yellow);
      height: 40px;
      line-height: 40px;
    }
    .step-label { font-size: 0.85rem; color: #fff; height: 20px; }
    
    .platform-badge {
      display: inline-block;
      background: #222;
      color: #ffcc00;
      border: 1px solid #ffcc00;
      font-size: 0.75rem;
      padding: 1px 5px;
      border-radius: 3px;
      margin-left: 4px;
    }
    
    .arrow { color: #38bdf8; font-size: 1.6rem; font-weight: bold; text-align: center; }
  </style>
</head>

        </div>
      </div>
    </div>

        : "佐野・館林・浅草 方面";

      document.getElementById("senju-card-title").textContent = isEnglish
        ? "Connection for Kita-senju (via Tatebayashi)"
        : "北千住方面 接続案内（館林乗り換え / 直通）";

      document.getElementById("st-kuzu").textContent = isEnglish ? "Kuzuu Sta." : "葛生";
      document.getElementById("lbl-sano-line").textContent = isEnglish ? "Tobu Sano Line" : "東武佐野線";

      document.getElementById("st-tatebayashi").textContent = isEnglish ? "Tatebayashi Sta." : "館林駅 乗り換え";

      document.getElementById("st-senju").textContent = isEnglish ? "Kita-senju Sta." : "北千住駅 到着";
      document.getElementById("lbl-senju-arr").textContent = isEnglish ? "Est. Arrival" : "到着予定";
    }

    function updateMonitor() {
      const now = new Date();
      const currentMin = now.getHours() * 60 + now.getMinutes();
      const currentSec = now.getSeconds();

      const upcomingMy = kuzuFullRoutes.filter(r => {
        const [h, m] = r.time.split(":").map(Number);
        return (h * 60 + m) > currentMin || ((h * 60 + m) === currentMin && currentSec === 0);
      });

      setRowData("m1", upcomingMy[0]);
      setRowData("m2", upcomingMy[1]);
      setRowData("m3", upcomingMy[2]);

      const nextRoute = senjuFullRoutes.find(r => {
        const [h, m] = r.kuzuDep.split(":").map(Number);
        return (h * 60 + m) > currentMin || ((h * 60 + m) === currentMin && currentSec === 0);
      });

      if (nextRoute) {
        document.getElementById("kuzu-dep-time").textContent = nextRoute.kuzuDep;
        
        document.getElementById("tatebayashi-time").textContent = isEnglish 
          ? `${nextRoute.tateArr} Arr / ${nextRoute.tateDep.split(' ')[0]} Dep`
          : `${nextRoute.tateArr}着 / ${nextRoute.tateDep}`;

        document.getElementById("lbl-transfer-info").textContent = isEnglish ? nextRoute.noteEn : nextRoute.noteJa;

        document.getElementById("senju-arr-time").textContent = nextRoute.senjuArr;

        const [h, m] = nextRoute.kuzuDep.split(":").map(Number);
        const targetSec = (h * 60 + m) * 60;
        const currentTotalSec = currentMin * 60 + currentSec;
        const diffSec = targetSec - currentTotalSec;

        const min = Math.floor(diffSec / 60);
        const sec = diffSec % 60;
        const countdownEl = document.getElementById("senju-countdown");

        const prefixText = isEnglish ? "In " : "あと ";
        countdownEl.textContent = `${prefixText}${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
      } else {
        document.getElementById("kuzu-dep-time").textContent = "--:--";
        document.getElementById("tatebayashi-time").textContent = "--:-- Arr / --:-- Dep";
        document.getElementById("senju-arr-time").textContent = "--:--";
        document.getElementById("senju-countdown").textContent = isEnglish ? "End of Service" : "本日の運行終了";
      }
    }

    function setRowData(prefix, data) {
      if (data) {
        document.getElementById(`${prefix}-time`).textContent = data.time;
        document.getElementById(`${prefix}-dest`).textContent = isEnglish ? data.destEn : data.destJa;
        document.getElementById(`${prefix}-cars`).innerHTML = `${data.cars}<span class="cars-unit">${isEnglish ? 'Cars' : '両'}</span>`;
        document.getElementById(`${prefix}-badge`).textContent = isEnglish ? data.typeEn : data.typeJa;
        document.getElementById(`${prefix}-badge`).className = `train-badge ${data.badge}`;
      } else {
        document.getElementById(`${prefix}-time`).textContent = "--:--";
        document.getElementById(`${prefix}-dest`).textContent = isEnglish ? "Terminated" : "終了";
        document.getElementById(`${prefix}-cars`).innerHTML = `--<span class="cars-unit">${isEnglish ? 'Cars' : '両'}</span>`;
      }
    }

    setInterval(updateMonitor, 1000);
    updateMonitor();
  </script>
</body>
</html>
